name: Kustomize Diff

on:
  workflow_call:
    inputs:
      build-paths:
        description: Comma-separated glob patterns of kustomize directories to build
        required: true
        type: string
    outputs:
      has-changes:
        description: Whether any kustomize output changed between base and PR
        value: ${{ jobs.diff-comment.outputs.has-changes }}

permissions:
  contents: read
  pull-requests: write

jobs:
  build-pr:
    name: Build kustomize from PR branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build kustomize
        env:
          BUILD_PATHS: ${{ inputs.build-paths }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kustomize-output

          build_kustomize() {
            local path="$1"
            local output_file="$2"
            if command -v kustomize >/dev/null 2>&1; then
              kustomize build "$path" > "$output_file"
              return
            fi
            if command -v kubectl >/dev/null 2>&1; then
              kubectl kustomize "$path" > "$output_file"
              return
            fi
            echo "Error: Neither 'kustomize' nor 'kubectl' found in runner PATH."
            exit 1
          }

          IFS=',' read -ra PATTERNS <<< "$BUILD_PATHS"
          shopt -s nullglob
          for pattern in "${PATTERNS[@]}"; do
            pattern="${pattern// /}"
            for dir in $pattern; do
              [ "$(basename "$dir")" = "base" ] && continue
              [ -f "${dir}/kustomization.yaml" ] || continue
              output_name="${dir//\//-}"
              build_kustomize "$dir" "kustomize-output/${output_name}.yaml"
            done
          done

      - name: Upload kustomize output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kustomize-pr
          path: kustomize-output/

  build-base:
    name: Build kustomize from base branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Build kustomize
        env:
          BUILD_PATHS: ${{ inputs.build-paths }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kustomize-output

          build_kustomize() {
            local path="$1"
            local output_file="$2"
            if command -v kustomize >/dev/null 2>&1; then
              kustomize build "$path" > "$output_file"
              return
            fi
            if command -v kubectl >/dev/null 2>&1; then
              kubectl kustomize "$path" > "$output_file"
              return
            fi
            echo "Error: Neither 'kustomize' nor 'kubectl' found in runner PATH."
            exit 1
          }

          IFS=',' read -ra PATTERNS <<< "$BUILD_PATHS"
          shopt -s nullglob
          for pattern in "${PATTERNS[@]}"; do
            pattern="${pattern// /}"
            for dir in $pattern; do
              [ "$(basename "$dir")" = "base" ] && continue
              output_name="${dir//\//-}"
              # Dir doesn't exist on base (new path added in PR): create empty placeholder
              if [ ! -d "$dir" ]; then
                touch "kustomize-output/${output_name}.yaml"
                continue
              fi
              # Dir exists but has no kustomization.yaml: skip (same as PR build)
              [ -f "${dir}/kustomization.yaml" ] || continue
              build_kustomize "$dir" "kustomize-output/${output_name}.yaml"
            done
          done

      - name: Upload kustomize base output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kustomize-base
          path: kustomize-output/

  diff-comment:
    name: Post kustomize diff comment
    runs-on: ubuntu-latest
    needs: [build-pr, build-base]
    if: always() && needs.build-pr.result == 'success' && needs.build-base.result == 'success'
    outputs:
      has-changes: ${{ steps.diff.outputs.has_changes }}
    steps:
      - name: Download PR kustomize output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kustomize-pr
          path: kustomize-pr/

      - name: Download base kustomize output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kustomize-base
          path: kustomize-base/

      - name: Install dyff
        shell: bash
        run: |
          curl -fsSL -o dyff.tar.gz https://github.com/homeport/dyff/releases/download/v1.11.2/dyff_1.11.2_linux_amd64.tar.gz
          echo "84e952f8ac40c8824de83d81261f9f6c5b984b5ff367eb08b688e0c1450a4f85  dyff.tar.gz" | sha256sum -c -
          tar -xzf dyff.tar.gz -C /usr/local/bin dyff
          rm dyff.tar.gz

      - name: Generate diff comment
        id: diff
        shell: bash
        run: |
          # GitHub rejects issue comments over 65,536 characters, and the comment
          # action silently truncates the tail rather than failing - so one large
          # path (e.g. a ConfigMap with a dashboard JSON embedded) could push every
          # later path's diff out of the comment with no sign anything was dropped.
          #
          # Give each changed path an equal share of the budget instead. A PR that
          # touches a single path still renders in full, exactly as before; only
          # when several paths change, or one is genuinely enormous, is anything
          # cut - and then it is cut explicitly, with a marker saying so.
          MAX_COMMENT_CHARS=63000
          MIN_BLOCK_CHARS=2000

          CHANGED=0
          TOTAL=0
          OMITTED=0
          BODY_CHARS=0
          > /tmp/diff-body.md

          # render_diff <text> <max-chars> - print text, truncated on a line boundary.
          render_diff() {
            local text="$1" max="$2" shown shown_lines total_lines
            if [ "${#text}" -le "$max" ]; then
              printf '%s' "$text"
              return
            fi
            shown="${text:0:$max}"
            shown="${shown%$'\n'*}"
            shown_lines=$(printf '%s\n' "$shown" | wc -l | tr -d ' ')
            total_lines=$(printf '%s\n' "$text" | wc -l | tr -d ' ')
            printf '%s\n... [truncated: %s of %s diff lines shown - see the Files changed tab for the rest]' \
              "$shown" "$shown_lines" "$total_lines"
          }

          resolve() {
            [ -f "${1}/${2}" ] && printf '%s' "${1}/${2}" || printf '/dev/null'
          }

          all_files=$(
            { ls kustomize-pr/*.yaml 2>/dev/null; ls kustomize-base/*.yaml 2>/dev/null; } \
              | xargs -I{} basename {} | sort -u
          )

          # Pass 1: find which paths changed, so the budget can be shared between them.
          changed_files=()
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            TOTAL=$((TOTAL + 1))
            base_file=$(resolve kustomize-base "$file")
            pr_file=$(resolve kustomize-pr "$file")
            if ! dyff between --omit-header --set-exit-code "$base_file" "$pr_file" >/dev/null 2>&1; then
              changed_files+=("$file")
            fi
          done <<< "$all_files"
          CHANGED=${#changed_files[@]}

          # Pass 2: render, splitting each path's share between the short and full blocks.
          if [ "$CHANGED" -gt 0 ]; then
            BLOCK_CHARS=$((MAX_COMMENT_CHARS / CHANGED / 2))
            if [ "$BLOCK_CHARS" -lt "$MIN_BLOCK_CHARS" ]; then
              BLOCK_CHARS=$MIN_BLOCK_CHARS
            fi

            for file in "${changed_files[@]}"; do
              display="${file%.yaml}"
              display="${display//-//}"
              base_file=$(resolve kustomize-base "$file")
              pr_file=$(resolve kustomize-pr "$file")

              SHORT_DIFF=$(diff --unified "$base_file" "$pr_file" 2>&1 | tail -n +3 | sed 's/```/` ` `/g') || true
              FULL_DIFF=$(diff --unified=9999 "$base_file" "$pr_file" 2>&1 | tail -n +3 | sed 's/```/` ` `/g') || true
              CHANGED_LINES=$(printf '%s\n' "$SHORT_DIFF" | grep -c '^[+-]') || true

              BLOCK=$(
                echo "<details><summary>🔴 <code>${display}</code></summary>"
                echo ""
                echo '```diff'
                render_diff "$SHORT_DIFF" "$BLOCK_CHARS"
                echo ""
                echo '```'
                echo ""
                echo "<details><summary>Show full output</summary>"
                echo ""
                echo '```diff'
                render_diff "$FULL_DIFF" "$BLOCK_CHARS"
                echo ""
                echo '```'
                echo ""
                echo "</details>"
                echo ""
                echo "</details>"
                echo ""
              )

              if [ $((BODY_CHARS + ${#BLOCK})) -gt "$MAX_COMMENT_CHARS" ]; then
                OMITTED=$((OMITTED + 1))
                LINE="- 🔴 \`${display}\` - ${CHANGED_LINES} changed lines, diff omitted to fit the comment size limit"
                printf '%s\n' "$LINE" >> /tmp/diff-body.md
                BODY_CHARS=$((BODY_CHARS + ${#LINE} + 1))
              else
                # $(...) strips trailing newlines; re-add the blank line the block ends with.
                printf '%s\n\n' "$BLOCK" >> /tmp/diff-body.md
                BODY_CHARS=$((BODY_CHARS + ${#BLOCK} + 2))
              fi
            done
          fi

          {
            echo "<!-- kustomize-diff -->"
            echo "## Kustomize Diff"
            echo ""
            if [ "$CHANGED" -gt 0 ]; then
              echo "**${CHANGED} of ${TOTAL} paths changed**"
              if [ "$OMITTED" -gt 0 ]; then
                echo ""
                echo "> ${OMITTED} path(s) are listed without a diff to keep this comment under GitHub's 65,536-character limit."
              fi
            else
              echo "✅ No kustomize output changes detected across all ${TOTAL} paths."
            fi
            echo ""
            cat /tmp/diff-body.md
          } > /tmp/diff-comment.md

          echo "has_changes=$([ "$CHANGED" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Find existing comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- kustomize-diff -->"

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-file: /tmp/diff-comment.md
          edit-mode: replace
