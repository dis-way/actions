name: Prepare Job for Pushing OCI Artifacts to Azure Container Registry
description: Downloads flux cli and fetches credentials for the Azure Container Registry (ACR) to use with flux.

inputs:
  flux_version:
    description: "Version of flux to use"
    required: false
    # renovate: datasource=github-releases depName=flux-cli packageName=fluxcd/flux2 versioning=semver
    default: "2.6.4"
  azure_app_id:
    description: "Azure application id used to authenticate to altinncr"
    required: true
  azure_subscription_id:
    description: "Azure subscription id used to authenticate to altinncr"
    required: true
  azure_tenant_id:
    description: "Azure tenant id used to authenticate to altinncr"
    required: true
  acr_name:
    description: "Name of the Azure Container Registry (ACR) to use"
    required: false
    default: "altinncr"

runs:
  using: composite
  steps:
    - name: Setup flux
      uses: fluxcd/flux2/action@f05a280b876a3a1d35a76a91f701e605777853aa # v2.9.1
      with:
        version: ${{ inputs.flux_version }}
    - name: az login
      uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
      with:
        client-id: ${{ inputs.azure_app_id }}
        subscription-id: ${{ inputs.azure_subscription_id }}
        tenant-id: ${{ inputs.azure_tenant_id }}
