apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: storefront-dev

resources:
  - ../../base

images:
  - name: ghcr.io/dis-way/storefront
    newTag: v1.4.0

replicas:
  - name: storefront
    count: 1

patches:
  - target:
      kind: ConfigMap
      name: storefront-config
    patch: |
      - op: replace
        path: /data/LOG_LEVEL
        value: debug
